<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GC Bot — Login</title>
<style>
  :root {
    --bg: #0d0d12;
    --surface: #16161f;
    --border: #2a2a3a;
    --accent: #7c6af7;
    --accent-dim: #4f43c4;
    --text: #e8e8f0;
    --muted: #6b6b82;
    --error: #f06b7a;
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f0f0f8;
      --surface: #ffffff;
      --border: #d0d0e0;
      --text: #1a1a2e;
      --muted: #7070a0;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2.5rem 2rem;
    width: min(380px, 92vw);
    display: flex;
    flex-direction: column;
    gap: 1.4rem;
  }
  .logo {
    text-align: center;
  }
  .logo-icon {
    width: 60px; height: 60px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), #c86dd7);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    margin-bottom: .6rem;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text);
    text-align: center;
  }
  p.sub {
    font-size: .82rem;
    color: var(--muted);
    text-align: center;
  }
  label {
    font-size: .78rem;
    color: var(--muted);
    display: block;
    margin-bottom: .35rem;
    font-weight: 500;
    letter-spacing: .02em;
  }
  input[type="password"] {
    width: 100%;
    padding: .7rem 1rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: .95rem;
    outline: none;
    transition: border-color .2s;
  }
  input[type="password"]:focus { border-color: var(--accent); }
  button[type="submit"] {
    width: 100%;
    padding: .8rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
  }
  button[type="submit"]:hover { background: var(--accent-dim); }
  .error {
    background: rgba(240,107,122,.12);
    border: 1px solid rgba(240,107,122,.35);
    border-radius: 8px;
    padding: .6rem .9rem;
    font-size: .82rem;
    color: var(--error);
    text-align: center;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🤖</div>
    <h1>GC Bot Panel</h1>
    <p class="sub">Instagram Group Chat Automation</p>
  </div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/login">
    <label>Admin Password</label>
    <input type="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
    <br><br>
    <button type="submit">Sign In</button>
  </form>
</div>
</body>
</html>
